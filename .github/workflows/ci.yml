name: PayFlow CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint-and-test:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payflow_user
          POSTGRES_PASSWORD: payflow_password
          POSTGRES_DB: payflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Prisma Client Generate
        working-directory: backend
        run: npx prisma generate

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://payflow_user:payflow_password@localhost:5432/payflow_test?schema=public
        run: npx prisma migrate deploy

      - name: Lint Code
        working-directory: backend
        run: npm run lint

      - name: Run Unit & Integration Tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://payflow_user:payflow_password@localhost:5432/payflow_test?schema=public
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
        run: npm test

  flutter-lint-and-test:
    name: Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get
        continue-on-error: true

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test
        continue-on-error: true
