name: payflow_mobile
description: PayFlow UPI Payment Simulator - SIMULATION ONLY
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  uuid: ^4.4.2
  crypto: ^3.0.5
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  share_plus: ^10.0.2
  pdf: ^3.11.1
  path_provider: ^2.1.4
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
