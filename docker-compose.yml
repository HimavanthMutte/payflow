version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: always
    environment:
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_password
      POSTGRES_DB: payflow
    ports:
      - '5432:5432'
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payflow_user -d payflow']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://payflow_user:payflow_password@postgres:5432/payflow?schema=public
      JWT_SECRET: super_secret_production_ready_jwt_key_32_chars_min!
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      MIN_PAYMENT_AMOUNT_PAISE: 100
      MAX_PAYMENT_AMOUNT_PAISE: 500000000
      LOG_LEVEL: debug
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  payflow_pgdata:
